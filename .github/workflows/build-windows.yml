name: Build Windows Downloader (.exe)

on:
  push:
    branches: [main, release/1.3.0]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Download yt-dlp.exe and ffmpeg.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/bin
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "windows/bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "windows/bin/ffmpeg.exe"

      - name: Build Zagruzchik-Windows.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Zagruzchik-Windows" `
            --add-binary "windows/bin/yt-dlp.exe;bin" `
            --add-binary "windows/bin/ffmpeg.exe;bin" `
            windows/downloader_win.py
        shell: pwsh

      - name: Upload to GitHub Release v1.6.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          files: dist/Zagruzchik-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
